name: Build and publish Thumb Finder

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            artifact: windows-x64
          - name: macOS Intel
            os: macos-15-intel
            artifact: macos-intel-x64
          - name: macOS Apple Silicon
            os: macos-15
            artifact: macos-apple-silicon-arm64

    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set version from Git tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python - "$VERSION" <<'PY'
          import pathlib, sys
          version = sys.argv[1]
          path = pathlib.Path("thumb_finder/version.py")
          path.write_text(
              '"""Single source of truth for the application version."""\n'
              f'__version__ = "{version}"\n',
              encoding="utf-8"
          )
          pyproject = pathlib.Path("pyproject.toml")
          text = pyproject.read_text(encoding="utf-8")
          import re
          text = re.sub(r'(?m)^version = "[^"]+"$', f'version = "{version}"', text, count=1)
          pyproject.write_text(text, encoding="utf-8")
          PY

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pytest

      - name: Run tests
        run: python -m pytest -q

      - name: Build Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --name ThumbFinder `
            --collect-all PySide6 --collect-all cv2 `
            --add-data "thumb_finder/app_icon.svg;thumb_finder" `
            --add-data "thumb_finder/logo.svg;thumb_finder" `
            run_app.py
          Compress-Archive -Path dist/ThumbFinder -DestinationPath ThumbFinder-${{ github.ref_name }}-${{ matrix.artifact }}.zip

      - name: Build macOS app
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm --clean --windowed --name ThumbFinder \
            --collect-all PySide6 --collect-all cv2 \
            --add-data "thumb_finder/app_icon.svg:thumb_finder" \
            --add-data "thumb_finder/logo.svg:thumb_finder" \
            run_app.py
          ditto -c -k --sequesterRsrc --keepParent dist/ThumbFinder.app \
            "ThumbFinder-${GITHUB_REF_NAME}-${{ matrix.artifact }}.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThumbFinder-${{ github.ref_name }}-${{ matrix.artifact }}
          path: ThumbFinder-${{ github.ref_name }}-${{ matrix.artifact }}.zip
          if-no-files-found: error
          retention-days: 14

      - name: Attach build to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ThumbFinder-${{ github.ref_name }}-${{ matrix.artifact }}.zip
          generate_release_notes: true
