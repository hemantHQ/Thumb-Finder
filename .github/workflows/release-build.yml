name: Build Thumb Finder for Apple Silicon

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the verified ZIP to Releases from the default branch
        type: boolean
        default: true
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  macos-arm64:
    if: github.event_name == 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch
    runs-on: macos-15
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: arm64
      - name: Set build version
        id: release
        shell: bash
        run: |
          tag="v1.0-build-$GITHUB_RUN_NUMBER"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$GITHUB_RUN_NUMBER" > thumb_finder/build_version.txt
      - name: Install and test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          test "$(uname -m)" = arm64
          python -m pip install -r requirements.txt "pyinstaller>=6,<7"
          python -m compileall -q run_app.py thumb_finder tests
          python -m unittest discover -s tests
      - name: Provide optional build defaults
        if: github.event_name == 'workflow_dispatch' && !inputs.publish_release
        env:
          YOUTUBE_API_KEY_1: ${{ secrets.YOUTUBE_API_KEY_1 }}
          YOUTUBE_API_KEY_2: ${{ secrets.YOUTUBE_API_KEY_2 }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os

          keys = tuple(os.environ.get(f"YOUTUBE_API_KEY_{i}", "") for i in (1, 2))
          Path("thumb_finder/_build_keys.py").write_text(f"KEYS = {keys!r}\n")
          PY
      - name: Package
        env:
          QT_QPA_PLATFORM: offscreen
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          mkdir -p build/AppIcon.iconset
          python - <<'PY'
          from PySide6.QtCore import Qt
          from PySide6.QtGui import QGuiApplication, QImage, QPainter
          from PySide6.QtSvg import QSvgRenderer

          app = QGuiApplication([])
          renderer = QSvgRenderer("thumb_finder/app_icon.svg")
          assert renderer.isValid(), "The source app icon could not be loaded."
          for size in (16, 32, 128, 256, 512):
              for scale in (1, 2):
                  pixels = size * scale
                  image = QImage(pixels, pixels, QImage.Format.Format_ARGB32)
                  image.fill(Qt.GlobalColor.transparent)
                  painter = QPainter(image)
                  renderer.render(painter)
                  painter.end()
                  suffix = "@2x" if scale == 2 else ""
                  assert image.save(f"build/AppIcon.iconset/icon_{size}x{size}{suffix}.png")
          PY
          iconutil -c icns build/AppIcon.iconset -o build/AppIcon.icns
          python -m PyInstaller --noconfirm --windowed --name "Thumb Finder" --icon build/AppIcon.icns --add-data "thumb_finder/app_icon.svg:thumb_finder" --add-data "thumb_finder/chevron.svg:thumb_finder" --add-data "thumb_finder/offline_worker.py:thumb_finder" --add-data "thumb_finder/build_version.txt:thumb_finder" --target-arch arm64 --osx-bundle-identifier com.thumbfinder.app run_app.py
          ditto -c -k --keepParent "dist/Thumb Finder.app" "dist/Thumb-Finder-$RELEASE_TAG-macOS-arm64.zip"
          unzip -t "dist/Thumb-Finder-$RELEASE_TAG-macOS-arm64.zip"
      - name: Verify signature, icon, and launch from the release ZIP
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          verify_dir="$(mktemp -d)"
          archive="dist/Thumb-Finder-$RELEASE_TAG-macOS-arm64.zip"
          python -c 'import sys; from thumb_finder.updater import check_archive; check_archive(sys.argv[1])' "$archive"
          ditto -x -k "$archive" "$verify_dir"
          bundle="$verify_dir/Thumb Finder.app"
          executable="$bundle/Contents/MacOS/Thumb Finder"
          lipo "$executable" -verify_arch arm64
          codesign --verify --deep --strict --verbose=2 "$bundle"
          python - "$bundle" "$executable" "$verify_dir" <<'PY'
          from pathlib import Path
          import os
          import plistlib
          import subprocess
          import sys
          from thumb_finder.updater import verify_bundle

          bundle, executable, verify_dir = map(Path, sys.argv[1:])
          verify_bundle(bundle, os.environ["RELEASE_TAG"])
          contents = bundle / "Contents"
          with (contents / "Info.plist").open("rb") as file:
              info = plistlib.load(file)
          icon = contents / "Resources" / info["CFBundleIconFile"]
          if not icon.suffix:
              icon = icon.with_suffix(".icns")
          assert icon.read_bytes().startswith(b"icns"), "The Finder icon is missing or invalid."
          marker = verify_dir / "launch-ok"
          env = os.environ.copy()
          env["QT_QPA_PLATFORM"] = "cocoa"
          subprocess.run([str(executable), "--smoke-test", str(marker)],
                         env=env, timeout=40, check=True)
          assert marker.read_text(encoding="utf-8") == "cocoa", "The native Qt window failed to launch."
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Thumb-Finder-${{ steps.release.outputs.tag }}-macOS-arm64
          path: dist/Thumb-Finder-${{ steps.release.outputs.tag }}-macOS-arm64.zip
          if-no-files-found: error

  publish:
    name: Publish macOS ZIP to Releases
    needs: macos-arm64
    if: >-
      github.ref_type == 'branch' &&
      github.ref_name == github.event.repository.default_branch &&
      (github.event_name == 'push' || inputs.publish_release)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: thumb-finder-release-v1.0
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: Thumb-Finder-${{ needs.macos-arm64.outputs.tag }}-macOS-arm64
          path: release
      - name: Publish verified asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.macos-arm64.outputs.tag }}
        shell: bash
        run: |
          tag="$RELEASE_TAG"
          zip="release/Thumb-Finder-$tag-macOS-arm64.zip"
          test -s "$zip"
          latest="$(gh release list --limit 25 --exclude-drafts --exclude-pre-releases --json isLatest,tagName --jq '.[] | select(.isLatest) | .tagName')"
          if [[ "$latest" =~ ^v1\.0-build-([1-9][0-9]*)$ ]] && (( BASH_REMATCH[1] > GITHUB_RUN_NUMBER )); then
            echo "A newer build is already published."
            exit 0
          fi
          commit="$(git rev-parse HEAD)"
          if tagged="$(git rev-parse --verify "refs/tags/$tag^{commit}" 2>/dev/null)"; then
            if [[ "$tagged" != "$commit" ]]; then
              echo "::error::The $tag tag already points to another commit. Use a new version tag for this build."
              exit 1
            fi
            target=(--verify-tag)
          else
            target=(--target "$commit")
          fi
          if draft="$(gh release view "$tag" --json isDraft --jq '.isDraft')"; then
            if [[ "$draft" == true ]]; then
              echo "::error::A draft release for $tag already exists. Review it before publishing."
              exit 1
            fi
            if gh release view "$tag" --json assets --jq '.assets[].name' | grep -Fxq "${zip##*/}"; then
              echo "The macOS ZIP is already attached to $tag."
            else
              gh release upload "$tag" "$zip"
            fi
          else
            gh release create "$tag" "$zip" "${target[@]}" \
              --latest \
              --title "Thumb Finder v1.0 — macOS Apple Silicon" \
              --notes "Build $GITHUB_RUN_NUMBER for Apple Silicon (arm64), including Mac mini M4 and M6. This build is ad-hoc signed and unnotarized. Configure your keys in Thumb Finder Settings."
          fi
