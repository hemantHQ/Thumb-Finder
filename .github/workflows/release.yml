name: Build and publish Thumb Finder

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing version tag to build (for example v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
    steps:
      - name: Check out selected source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify release version
        id: version
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          APP_VERSION="$(python -c 'from thumb_finder.version import __version__; print(__version__)')"
          TAG_VERSION="${REQUESTED_TAG#v}"
          if [ "$TAG_VERSION" != "$APP_VERSION" ]; then
            echo "Tag $REQUESTED_TAG does not match application version $APP_VERSION"
            exit 1
          fi
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "release_tag=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            artifact_path: Thumb-Finder-Windows-Portable.zip
          - os: macos-15-intel
            platform: macos-intel
            architecture: x86_64
            artifact_path: |
              Thumb-Finder-macOS-Intel-Portable.zip
              Thumb-Finder-macOS-Intel.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out selected source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow

      - name: Create app icons
        run: python scripts/create_icons.py

      - name: Create macOS icon
        if: runner.os == 'macOS'
        run: |
          iconutil -c icns build_icons/ThumbFinder.iconset -o thumb_finder/app_icon.icns
          test -f thumb_finder/app_icon.icns

      - name: Inject release API configuration
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          THUMB_FINDER_BUILD_NUMBER: ${{ github.run_number }}
        run: python scripts/inject_api_key.py

      - name: Build Windows portable application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir `
            --name "Thumb-Finder" `
            --icon "thumb_finder/app_icon.ico" `
            --collect-all cv2 --collect-all numpy `
            --exclude-module matplotlib --exclude-module scipy --exclude-module pandas `
            --exclude-module tkinter --exclude-module unittest --exclude-module test `
            --exclude-module PySide6.QtWebEngineWidgets --exclude-module PySide6.QtWebEngineCore `
            --exclude-module PySide6.QtQml --exclude-module PySide6.QtQuick `
            --add-data "thumb_finder/app_icon.svg;." `
            --add-data "thumb_finder/app_icon.ico;." `
            --add-data "thumb_finder/logo.svg;." `
            run_app.py
          if (!(Test-Path "dist/Thumb-Finder/Thumb-Finder.exe")) { throw "Portable Windows executable missing" }
          Compress-Archive -Path "dist/Thumb-Finder" -DestinationPath "Thumb-Finder-Windows-Portable.zip" -CompressionLevel Optimal -Force
          if (!(Test-Path "Thumb-Finder-Windows-Portable.zip")) { throw "Windows portable ZIP missing" }

      - name: Verify macOS architecture
        if: runner.os == 'macOS'
        env:
          EXPECTED_ARCH: ${{ matrix.architecture }}
        run: test "$(uname -m)" = "$EXPECTED_ARCH"

      - name: Build Intel macOS app bundle
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir \
            --name "Thumb Finder" \
            --icon "thumb_finder/app_icon.icns" \
            --osx-bundle-identifier "com.thumbfinder.app" \
            --collect-all cv2 --collect-all numpy \
            --exclude-module matplotlib --exclude-module scipy --exclude-module pandas \
            --exclude-module tkinter --exclude-module unittest --exclude-module test \
            --exclude-module PySide6.QtWebEngineWidgets --exclude-module PySide6.QtWebEngineCore \
            --exclude-module PySide6.QtQml --exclude-module PySide6.QtQuick \
            --add-data "thumb_finder/app_icon.svg:." \
            --add-data "thumb_finder/app_icon.icns:." \
            --add-data "thumb_finder/logo.svg:." \
            run_app.py
          test -d "dist/Thumb Finder.app"
          ditto -c -k --sequesterRsrc --keepParent "dist/Thumb Finder.app" "Thumb-Finder-macOS-Intel-Portable.zip"
          hdiutil create -volname "Thumb Finder" -srcfolder "dist/Thumb Finder.app" -ov -format UDZO "Thumb-Finder-macOS-Intel.dmg"
          test -f "Thumb-Finder-macOS-Intel-Portable.zip"
          test -f "Thumb-Finder-macOS-Intel.dmg"

      - name: Upload platform packages
        uses: actions/upload-artifact@v4
        with:
          name: Thumb-Finder-${{ matrix.platform }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: [validate, build]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Download platform packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate checksums and update manifest
        env:
          THUMB_FINDER_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          cd release-assets
          sha256sum Thumb-Finder-Windows-Portable.zip Thumb-Finder-macOS-Intel-Portable.zip Thumb-Finder-macOS-Intel.dmg > SHA256SUMS.txt
          cd ..
          python scripts/create_update_manifest.py

      - name: Publish or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
          APP_VERSION: ${{ needs.validate.outputs.app_version }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --repo "$GH_REPO" --clobber
            gh release edit "$RELEASE_TAG" --repo "$GH_REPO" --title "Thumb Finder v$APP_VERSION"
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --repo "$GH_REPO" \
              --title "Thumb Finder v$APP_VERSION" \
              --generate-notes
          fi
