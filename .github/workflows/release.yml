
name: Build and publish Thumb Finder

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing version tag to build (for example v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
    steps:
      - name: Check out selected tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify tag matches application version
        id: version
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          APP_VERSION="$(python -c 'from thumb_finder.version import __version__; print(__version__)')"
          TAG_VERSION="${REQUESTED_TAG#v}"

          if [ "$TAG_VERSION" != "$APP_VERSION" ]; then
            echo "Tag $REQUESTED_TAG does not match thumb_finder/version.py ($APP_VERSION)"
            exit 1
          fi

          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "release_tag=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows

          # Native Intel Mac build (x86_64)
          - os: macos-15-intel
            platform: macos-intel
            architecture: x86_64
            dmg_name: Thumb-Finder-macOS-Intel.dmg

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out selected tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Inject release API configuration
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/inject_api_key.py

      - name: Build Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir `
            --name "Thumb-Finder" `
            --collect-all cv2 --collect-all numpy --collect-all PySide6 --collect-all requests --collect-data certifi `
            --add-data "thumb_finder/app_icon.svg;." `
            --add-data "thumb_finder/logo.svg;." `
            run_app.py

      - name: Create Windows installer EXE
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $version = "${{ needs.validate.outputs.app_version }}"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"

          if (!(Test-Path $iscc)) {
            throw "Inno Setup compiler not found: $iscc"
          }

          & $iscc "/DAppVersion=$version" "installer/windows/thumb_finder.iss"

          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE"
          }

          if (!(Test-Path "installer/windows/output/Thumb-Finder-Setup.exe")) {
            throw "Windows installer EXE was not created"
          }

      - name: Verify macOS runner architecture
        if: runner.os == 'macOS'
        env:
          EXPECTED_ARCH: ${{ matrix.architecture }}
        run: |
          ACTUAL_ARCH="$(uname -m)"
          echo "Runner architecture: $ACTUAL_ARCH"
          echo "Expected architecture: $EXPECTED_ARCH"
          test "$ACTUAL_ARCH" = "$EXPECTED_ARCH"

      - name: Build macOS application bundle
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir \
            --name "Thumb Finder" \
            --osx-bundle-identifier "com.thumbfinder.app" \
            --collect-all cv2 --collect-all numpy --collect-all PySide6 --collect-all requests --collect-data certifi \
            --add-data "thumb_finder/app_icon.svg:." \
            --add-data "thumb_finder/logo.svg:." \
            run_app.py

          test -d "dist/Thumb Finder.app"

      - name: Create Intel macOS DMG
        if: runner.os == 'macOS'
        env:
          DMG_NAME: ${{ matrix.dmg_name }}
        run: |
          hdiutil create \
            -volname "Thumb Finder" \
            -srcfolder "dist/Thumb Finder.app" \
            -ov -format UDZO \
            "$DMG_NAME"

          test -f "$DMG_NAME"

      - name: Upload platform installer
        uses: actions/upload-artifact@v4
        with:
          name: Thumb-Finder-${{ matrix.platform }}
          path: ${{ matrix.platform == 'windows' && 'installer/windows/output/Thumb-Finder-Setup.exe' || matrix.dmg_name }}
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: [validate, build]
    runs-on: ubuntu-latest

    steps:
      # FIX: Checkout repository so GitHub CLI can identify it.
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Download platform installers
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          cd release-assets
          sha256sum Thumb-Finder-Setup.exe Thumb-Finder-macOS-Intel.dmg > SHA256SUMS.txt

      - name: Publish or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
          APP_VERSION: ${{ needs.validate.outputs.app_version }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* \
              --repo "$GH_REPO" \
              --clobber

            gh release edit "$RELEASE_TAG" \
              --repo "$GH_REPO" \
              --title "Thumb Finder v$APP_VERSION"
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --repo "$GH_REPO" \
              --title "Thumb Finder v$APP_VERSION" \
              --generate-notes
          fi
